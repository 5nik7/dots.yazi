# A TOML linter such as https://github.com/tombi-toml/tombi can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [2, 4, 5]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "none"
show_hidden = true
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1000
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[plugin]
prepend_previewers = [
  { url = "*.{[mM][dD],[mM][aA][rR][kK][dD][oO][wW][nN],[mM][dD][oO][wW][nN]}", run = "dots preview markdown" },
  { mime = "text/{markdown,x-markdown}", run = "dots preview markdown" },
  { mime = "image/{avif,hei?,jxl}", run = "dots preview image magick" },
  { mime = "image/svg+xml", run = "dots preview image svg" },
  { mime = "image/*", run = "dots preview image image" },
]

[[plugin.prepend_fetchers]]
id = "git"    # Remove if Yazi > v26.1.22
url = "*"
run = "dots"
group = "git"

[[plugin.prepend_fetchers]]
id = "git"    # Remove if Yazi > v26.1.22
url = "*/"
run = "dots"
group = "git"
